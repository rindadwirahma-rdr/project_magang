<!DOCTYPE html>
<html>
<head>
  <title>INPUT DATA KE SPREAD SHEET</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background-color: #0c0a0a; }
    #form-container {
      width: 500px;
      margin: 0 auto;
      background-color: #f1f1f7;
      border: 2px solid #da0808;
      border-radius: 10px;
      padding: 20px;
    }
    #form-container h2 { text-align: center; color: #1E90FF; }
    #form-container input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 2px solid #f1d0d0;
      border-radius: 5px;
    }
    #form-container input[type="submit"] {
      background-color: #1E90FF;
      color: #FFFFFF;
      border: none;
      border-radius: 5px;
      padding: 10px;
      cursor: pointer;
    }
    #form-container input[type="submit"]:hover { background-color: #004B8D; }
    #footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #f7f1f1;
    }
  </style>
</head>
<body>
  <div id="form-container">
    <h2>INPUT DATA KE SPREAD SHEET</h2>

    <!-- action sudah diganti sesuai permintaan -->
    <form action="https://script.google.com/macros/s/AKfycbzd8K_DJCcp--PdHelD3Gy11gzAdvest7eiNT7v_k7gaNRumhs-uJZ4ptrjqL0NO3gNiA/exec" method="post">

      <label for="nama">Nama:</label>
      <input type="text" id="nama" name="nama" required>

      <label for="nama_kantor">Nama Kantor:</label>
      <input type="text" id="nama_kantor" name="nama_kantor" required>

      <label for="nomor">Nomor:</label>
      <input type="text" id="nomor" name="nomor" required>

      <label for="total">Total:</label>
      <input type="text" id="total" name="total" required>

      <label for="keterangan">Keterangan:</label>
      <input type="text" id="keterangan" name="keterangan" required>

      <input type="submit" value="Simpan Data">
    </form>
  </div>

  <div id="footer">
    All Tutorial for you, jagan lupa subcribe karna akan selalu ada update
  </div>
</body>
</html>
